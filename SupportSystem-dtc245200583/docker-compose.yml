services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support_local_only
    ports:
      - "5432:5432"
    volumes:
      - support-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Support.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SupportDb: Host=postgres;Port=5432;Database=support;Username=support;Password=support_local_only
      RabbitMq__Uri: amqp://guest:guest@rabbitmq:5672/
      Assignment__DefaultTeamId: 11111111-1111-1111-1111-111111111111
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  assignment-worker:
    build:
      context: .
      dockerfile: Support.AssignmentWorker/Dockerfile
    environment:
      ConnectionStrings__SupportDb: Host=postgres;Port=5432;Database=support;Username=support;Password=support_local_only
      RabbitMq__Uri: amqp://guest:guest@rabbitmq:5672/
      Assignment__DefaultTeamId: 11111111-1111-1111-1111-111111111111
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  support-postgres:
